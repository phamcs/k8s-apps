apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: argo-events-linter
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: lint-pipeline
  arguments:
    parameters:
      - name: repo-url
        value: https://github.com/phamcs/k8s-apps.git
      - name: revision
        value: main
      - name: manifests-path
        value: manifests
  templates:
    - name: lint-pipeline
      steps:
        - - name: lint-events
            template: argo-events-linter
            arguments:
              artifacts:
                - name: k8s-apps
                  git:
                    repo: "{{workflow.parameters.repo-url}}"
                    revision: "{{workflow.parameters.revision}}"
                    disableSubmodules: true
    - name: argo-events-linter
      inputs:
        artifacts:
          - name: k8s-apps
            path: /workspace/k8s-apps
      container:
        image: quay.io/argoproj/argo-events:latest
        command: [argo-events]
        args:
          - lint
          - --strict
          - -R
          - /workspace/k8s-apps/{{workflow.parameters.manifests-path}}
