apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manifests-linter
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: lint-pipeline
  arguments:
    parameters:
      - name: repo-url
        value: https://github.com/phamcs/k8s-apps.git
      - name: revision
        value: main
      - name: manifests-path
        value: manifests/
  templates:
    - name: lint-pipeline
      steps:
        - - name: lint-events
            template: manifests-linter
            arguments:
              artifacts:
                - name: k8s-apps
                  git:
                    repo: "{{workflow.parameters.repo-url}}"
                    revision: "{{workflow.parameters.revision}}"
                    disableSubmodules: true
    - name: manifests-linter
      inputs:
        artifacts:
          - name: k8s-apps
            path: /workspace/k8s-apps
      container:
        image: alpine:latest
        command: [sh, -c]
        args:
          - |
            apk add --no-cache yamllint py3-pip pipx
            pipx install yamlfix
            export PATH=$PATH:/root/.local/bin
            yamllint /workspace/k8s-apps/{{workflow.parameters.manifests-path}}
            yamlfix /workspace/k8s-apps/{{workflow.parameters.manifests-path}}
