apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manifests-linter
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: linter-events
  arguments:
    parameters:
      - name: k8s-apps-repo
        value: https://github.com/phamcs/k8s-apps.git
      - name: k8s-apps-revision
        value: main
      - name: k8s-apps-image-name
        value: k8s-apps
      - name: manifests-path
        value: manifests/
      - name: misc-repo
        value: https://github.com/phamcs/misc.git
      - name: misc-revision
        value: main
      - name: misc-image-name
        value: misc
      - name: misc-path
        value: misc/
      - name: update-git
        value: update-git
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: linter-events
      dag:
        tasks:
          - name: checkout
            template: git-clone
            arguments:
              parameters:
                - name: k8s-apps-repo
                  value: "{{workflow.parameters.k8s-apps-repo}}"
                - name: k8s-apps-revision
                  value: "{{workflow.parameters.k8s-apps-revision}}"
                - name: misc-repo
                  value: "{{workflow.parameters.misc-repo}}"
                - name: misc-revision
                  value: "{{workflow.parameters.misc-revision}}"

          # - name: build-and-push
          #   template: build-image
          #   dependencies: [checkout]
          #   arguments:
          #     parameters:
          #       - name: image
          #         value: "{{workflow.parameters.image-name}}"

          - name: run-ae-linter
            template: run-ae-linter
            arguments:
              artifacts:
                - name: k8s-apps
                  git:
                    repo: "{{workflow.parameters.k8s-apps-repo}}"
                    revision: "{{workflow.parameters.k8s-apps-revision}}"
                    disableSubmodules: true
            dependencies: [checkout]

          - name: run-k8s-linter
            template: run-k8s-linter
            arguments:
              artifacts:
                - name: k8s-apps
                  git:
                    repo: "{{workflow.parameters.k8s-apps-repo}}"
                    revision: "{{workflow.parameters.k8s-apps-revision}}"
                    disableSubmodules: true
            dependencies: [checkout]

          - name: run-misc-linter
            template: run-misc-linter
            arguments:
              artifacts:
                - name: misc
                  git:
                    repo: "{{workflow.parameters.misc-repo}}"
                    revision: "{{workflow.parameters.misc-revision}}"
                    disableSubmodules: true
            dependencies: [checkout]

          - name: update-git
            template: update-git
            dependencies: [run-ae-linter, run-k8s-linter, run-misc-linter]
            arguments:
              parameters:
                - name: k8s-apps-image
                  value: "{{workflow.parameters.k8s-apps-image-name}}"
                - name: k8s-apps-tag
                  value: "{{workflow.parameters.k8s-apps-revision}}"
                - name: misc-image
                  value: "{{workflow.parameters.misc-image-name}}"
                - name: misc-tag
                  value: "{{workflow.parameters.misc-revision}}"

    - name: git-clone
      inputs:
        parameters:
          - name: k8s-apps-repo
          - name: k8s-apps-revision
          - name: misc-repo
          - name: misc-revision
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            git clone {{inputs.parameters.k8s-apps-repo}} /workspace/k8s-apps
            cd /workspace/k8s-apps
            git checkout {{inputs.parameters.k8s-apps-revision}}
            git clone {{inputs.parameters.misc-repo}} /workspace/misc
            cd /workspace/misc
            git checkout {{inputs.parameters.misc-revision}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    # - name: build-image
    #   inputs:
    #     parameters:
    #       - name: image

    #   container:
    #     image: gcr.io/kaniko-project/executor:latest
    #     command: ["/kaniko/executor"]
    #     args:
    #       - "--dockerfile=/workspace/k8s-apps/Dockerfile"
    #       - "--context=/workspace/k8s-apps"
    #       #- "--no-push"
    #       - "--destination=phamcs/{{workflow.parameters.image-name}}:{{workflow.parameters.git-revision}}"
    #       - "--cache=true"
    #     volumeMounts:
    #       - name: workspace
    #         mountPath: /workspace
    #       - name: docker-config
    #         mountPath: /kaniko/.docker
      #
      # Publishing images requires an access token. For hub.docker.com you can create one at https://hub.docker.com/settings/security
      # This needs to be mounted as `$DOCKER_CONFIG/config.json`. To do this, you'll need to create a secret as follows:
      #
      #   export DOCKER_USERNAME=******
      #   export DOCKER_TOKEN=******
      #   kubectl create secret generic docker-config --from-literal="config.json={\"auths\": {\"https://index.docker.io/v1/\": {\"auth\": \"$(echo -n $DOCKER_USERNAME:$DOCKER_TOKEN|base64)\"}}}"
      # volumes:
      #   - name: docker-config
      #     secret:
      #       secretName: docker-registry-credentials
      #       items:
      #         - key: .dockerconfigjson
      #           path: config.json

    - name: run-ae-linter
      inputs:
        artifacts:
          - name: k8s-apps
            path: /workspace/k8s-apps
      container:
        image: quay.io/argoproj/argo-events:latest
        command: [argo-events]
        args:
          - lint
          - --strict
          - -R
          - /workspace/k8s-apps/{{workflow.parameters.manifests-path}}

    - name: run-k8s-linter
      inputs:
        artifacts:
          - name: k8s-apps
            path: /workspace/k8s-apps
      container:
        image: alpine:latest
        command: [sh, -c]
        args:
          - |
            apk add --no-cache bash git py3-pip pipx yamllint
            pipx install yamlfix
            pipx ensurepath
            source ~/.bashrc
            yamllint -c /workspace/k8s-apps/{{workflow.parameters.misc-path}}/.yamllint.yml /workspace/k8s-apps/{{workflow.parameters.manifests-path}}
            yamlfix /workspace/k8s-apps/{{workflow.parameters.manifests-path}}

    - name: run-misc-linter
      inputs:
        artifacts:
          - name: misc
            path: /workspace/misc
      container:
        image: alpine:latest
        command: [sh, -c]
        args:
          - |
            apk add --no-cache bash git py3-pip pipx yamllint
            pipx install yamlfix
            pipx ensurepath
            source ~/.bashrc
            yamllint -c /workspace/{{workflow.parameters.misc-path}}/.yamllint.yml /workspace/{{workflow.parameters.misc-path}}
            yamlfix /workspace/{{workflow.parameters.misc-path}}

    - name: update-git
      inputs:
        parameters:
          - name: image
          - name: tag
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            # Clone k8s-apps repository
            git clone https://$(GIT_USER):$(GIT_TOKEN)@github.com/phamcs/k8s-apps.git /tmp/k8s-apps
            cd /tmp/k8s-apps
            # Commit and push
            git config user.email "phamcs@gmail.com"
            git config user.name "CI Pipeline"
            git add --all
            git commit -am "Linting yaml manifests"
            git push origin HEAD:main
            # Clone misc repository
            git clone https://$(GIT_USER):$(GIT_TOKEN)@github.com/phamcs/misc.git /tmp/misc
            cd /tmp/misc
            # Commit and push
            git config user.email "phamcs@gmail.com"
            git config user.name "CI Pipeline"
            git add --all
            git commit -am "Linting yaml manifests"
            git push origin HEAD:main
        env:
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: username
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token