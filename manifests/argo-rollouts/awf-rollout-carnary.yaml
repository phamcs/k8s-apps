apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: run-argo-workflow
  namespace: default
spec:
  args:
    - name: workflow-template-name
    - name: target-url
      value: "http://cluster.local"
  metrics:
    - name: integration-test-workflow
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: rollout-workflow-runner
                restartPolicy: Never
                containers:
                  - name: argo-submit
                    image: quay.io/argoproj/argocli:v3.5.10
                    args:
                      - submit
                      - --from=workflowtemplate/{{args.workflow-template-name}}
                      - -p
                      - target-url={{args.target-url}}
                      - --wait
                      - --log
---
apiVersion: v1
kind: Service
metadata:
  name: alpine-stable
spec:
  selector:
    app: alpine
  ports:
    - port: 81
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: alpine-canary
spec:
  selector:
    app: alpine
  ports:
    - port: 81
      targetPort: 8090
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: alpine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: docker.io/alpine:latest
          ports:
            - containerPort: 8090

  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: run-argo-workflow
            args:
              - name: run-argo-workflow
                value: smoke-test-carnary-suite
        - setWeight: 100

    blueGreen:
      activeService: alpine-stable
      previewService: alpine-carnary
      prePromotionAnalysis:
        templates:
          - templateName: run-argo-workflow
        args:
          - name: run-argo-workflow
            value: smoke-test-bluegreen-suite