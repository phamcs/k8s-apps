apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-workflow-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-workflow-runner-role
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-workflow-runner-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: rollout-workflow-runner
    namespace: default
roleRef:
  kind: Role
  name: rollout-workflow-runner-role
  apiGroup: rbac.authorization.k8s.io
