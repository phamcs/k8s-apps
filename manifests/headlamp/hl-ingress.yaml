apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: headlamp
  annotations:
    # Crucial flag to handle Argo-Events's internal self-signed certificates backend
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-forward-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - headlamp
    secretName: headlamp-tls
  rules:
    - host: headlamp
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: headlamp
              port:
                number: 80
