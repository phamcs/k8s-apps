apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external # Replace with your SecretStore or ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: headlamp # Adjust path based on your KV mount point

