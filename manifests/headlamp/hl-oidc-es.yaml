apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-sync
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: headlamp-oidc
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: headlamp
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: headlamp
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: headlamp
        property: issuer_url
    - secretKey: scopes
      remoteRef:
        key: headlamp
        property: scopes
