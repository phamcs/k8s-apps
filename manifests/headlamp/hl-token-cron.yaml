apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: headlamp-admin
type: kubernetes.io/service-account-token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-headlamp-token
  namespace: headlamp
spec:
  schedule: "0 */12 * * *" # Every 12 hours
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: headlamp-token-rotator
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN=$(kubectl create token headlamp-admin -n headlamp --duration=24h)
                  kubectl create secret generic headlamp-admin-rotated-token \
                    -n headlamp \
                    --from-literal=token="$TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -
