apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-headlamp-token
  namespace: headlamp
spec:
  schedule: "0 */12 * * *" # Every 12 hours
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: headlamp-token-rotator
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN=$(kubectl create token headlamp-admin -n headlamp --duration=24h)
                  kubectl create secret generic headlamp-admin-rotated-token \
                    -n headlamp \
                    --from-literal=token="$TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -
