apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headlamp

resources:
  - hl-ingress.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp
    version: 0.46.0   # Replace with the latest or desired version
    releaseName: headlamp
    namespace: headlamp
    valuesFile: hl-values.yaml